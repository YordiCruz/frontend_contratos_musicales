<!-- FORMULARIO REGISTRAR INTEGRANTE -->
<p-dialog
  header="Registrar Integrante"
  [modal]="true"
  [(visible)]="visible"
  [breakpoints]="{ '960px': '75vw', '640px': '95vw' }"
  [style]="{ width: '32rem' }"
>
  <span class="text-gray-500 block mb-4">Complete los datos del integrante.</span>

  <form [formGroup]="formCrear" class="p-fluid">

    <!-- PERSONA -->
    <p-divider align="left">
      <span class="text-sm font-semibold text-gray-600">Datos Personales</span>
    </p-divider>

    <div formGroupName="persona" class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <div class="flex flex-col">
        <label class="font-semibold">Nombre</label>
        <input pInputText formControlName="nombre" class="w-full" />
      </div>

      <div class="flex flex-col">
        <label class="font-semibold">Apellido</label>
        <input pInputText formControlName="apellido" class="w-full" />
      </div>

      <div class="flex flex-col">
        <label class="font-semibold">Documento</label>
        <input pInputText formControlName="documento_identidad" class="w-full" />
      </div>

      <div class="flex flex-col">
        <label class="font-semibold">Teléfono</label>
        <input pInputText formControlName="telefono" class="w-full" />
      </div>

      <div class="flex flex-col md:col-span-2">
        <label class="font-semibold">Correo</label>
        <input pInputText formControlName="email" class="w-full" />
      </div>

    </div>

    <!-- INTEGRANTE -->
    <p-divider align="left">
      <span class="text-sm font-semibold text-gray-600">Datos del Integrante</span>
    </p-divider>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <div class="flex flex-col md:col-span-2">
        <label class="font-semibold">Especialidad</label>
        <p-multiSelect
          [options]="especialidades()"
          optionLabel="nombre"
          optionValue="id"
          formControlName="id_especialidades"
          display="chip"
          placeholder="Seleccione especialidades"
          class="w-full"
          showToggleAll="false"
          filter="false"
        ></p-multiSelect>
      </div>

      <div class="flex flex-col">
        <label class="font-semibold">Tarifa</label>
        <p-inputNumber 
          formControlName="tarifa_base_hora" 
          [useGrouping]="false"
          class="w-full">
        </p-inputNumber>
      </div>

      <div class="flex flex-col">
        <label class="font-semibold">Moneda</label>
        <p-select 
          [options]="[
            { label: 'Bolivianos (BOB)', value: 'BOB' },
            { label: 'Dólares (USD)', value: 'USD' }
          ]"
          formControlName="moneda"
          placeholder="Seleccione moneda"
          class="w-full"
        ></p-select>
      </div>

      <div class="flex flex-col md:col-span-2">
        <label class="font-semibold">Descripción</label>
        <textarea pInputTextarea formControlName="descripcion" class="w-full"></textarea>
      </div>

      <div class="flex flex-col md:col-span-2">
        <label class="font-semibold">Fecha de Ingreso</label>
        <p-datepicker
          formControlName="fecha_ingreso"
          [showIcon]="true"
          dateFormat="dd/mm/yy"
          [showButtonBar]="true"
          [maxDate]="today"
          placeholder="Seleccione fecha"
          class="w-full"
        ></p-datepicker>
      </div>

    </div>

    <div class="flex justify-end gap-2 mt-4">
      <p-button label="Cancelar" severity="secondary" (click)="visible = false" />
      <p-button label="Guardar" (click)="guardarCrear()" [disabled]="formCrear.invalid" />
    </div>

  </form>
</p-dialog>

<!-- // FORMULARIO EDITAR INTEGRANTE -->
<p-dialog
  header="Editar Integrante"
  [modal]="true"
  [(visible)]="visibleeditar"
  [breakpoints]="{ '960px': '75vw', '640px': '95vw' }"
  [style]="{ width: '30rem' }"
>
  <form [formGroup]="formEditar" class="p-fluid">

    <p-divider align="left">
      <span class="text-sm font-semibold text-gray-600">Datos del Integrante</span>
    </p-divider>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <div class="flex flex-col md:col-span-2">
        <label class="font-semibold">Especialidad</label>
        <p-multiSelect
          [options]="especialidades()"
          optionLabel="nombre"
          optionValue="id"
          formControlName="id_especialidades"
          display="chip"
          placeholder="Seleccione especialidades"
          class="w-full"
          showToggleAll="false"
          filter="false"
        ></p-multiSelect>
      </div>

      <div class="flex flex-col">
        <label class="font-semibold">Tarifa</label>
        <input pInputText type="number" formControlName="tarifa_base_hora" class="w-full" />
      </div>

      <div class="flex flex-col">
        <label class="font-semibold">Moneda</label>
        <p-select 
          [options]="[
            { label: 'Bolivianos (BOB)', value: 'BOB' },
            { label: 'Dólares (USD)', value: 'USD' }
          ]"
          formControlName="moneda"
          placeholder="Seleccione moneda"
          class="w-full"
        ></p-select>
      </div>

      <div class="flex flex-col md:col-span-2">
        <label class="font-semibold">Descripción</label>
        <textarea pInputTextarea formControlName="descripcion" class="w-full"></textarea>
      </div>

    </div>

    <div class="flex justify-end gap-2 mt-4">
      <p-button label="Cancelar" severity="secondary" (click)="visibleeditar = false" />
      <p-button label="Guardar" (click)="guardarEditar()" [disabled]="formEditar.invalid" />
    </div>

  </form>
</p-dialog>


<div class="card">

  <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6 gap-4">
    <h1 class="text-3xl md:text-4xl font-bold">Lista de Integrantes</h1>

    <div class="flex flex-col md:flex-row items-stretch md:items-center gap-2">
      <p-iconfield iconPosition="left" class="w-full md:w-auto">
        <p-inputicon><i class="pi pi-search"></i></p-inputicon>
        <input
          pInputText
          type="text"
          placeholder="Buscar integrante..."
          class="border rounded px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 w-full"
          (input)="dt.filterGlobal($any($event.target).value, 'contains')"
        />
      </p-iconfield>

      <p-button
        label="Nuevo Integrante"
        icon="pi pi-plus"
        (click)="showDialogCrear()"
      ></p-button>
    </div>
  </div>

 <div class="overflow-x-auto w-full">
  <p-table
    [value]="integrantes()"
    #dt
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5, 10, 20]"
    [globalFilterFields]="[
      'persona.nombre',
      'persona.apellido',
      'especialidad',
      'tarifa_base_hora'
    ]"
    [customSort]="true"
    (sortFunction)="customSort($event)"
    [tableStyle]="{ 'min-width': '55rem' }"
  >

      <ng-template pTemplate="header">
        <tr>
          <th>#</th>

          <th pSortableColumn="persona.nombre">
            <div class="flex items-center gap-2">
              Nombre
              <p-sortIcon field="persona.nombre"></p-sortIcon>
            </div>
          </th>

          <th pSortableColumn="especialidad">
            <div class="flex items-center gap-2">
              Especialidad
            </div>
          </th>

          <th pSortableColumn="tarifa_base_hora">
            <div class="flex items-center gap-2">
              Tarifa
              <p-sortIcon field="tarifa_base_hora"></p-sortIcon>
            </div>
          </th>

          <th pSortableColumn="estado">
            <div class="flex items-center gap-2">
              Estado
              <p-sortIcon field="estado"></p-sortIcon>
            </div>
          </th>

          <th>Acciones</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-i="rowIndex" let-integ>
        <tr>
          <td>{{ i + 1 }}</td>
          <td>{{ integ.persona?.nombre }} {{ integ.persona?.apellido }}</td>

          <td>
            <ng-container *ngFor="let esp of integ.especialidades">
              <span class="px-2 py-1 rounded-xl bg-sky-500 text-white mr-1 mb-1 inline-block">
                {{ esp.nombre }}
              </span>
            </ng-container>
          </td>

          <td>{{ integ.tarifa_base_hora }} {{ integ.moneda }}</td>

          <td>
            <p-tag [value]="integ.estado" [severity]="integ.estado === 'activo' ? 'success' : 'danger'" />
          </td>

          <td>
            <ng-container *ngIf="integ.estado === 'activo'; else inactivoActions">
              <p-button icon="pi pi-pencil" class="mr-2" (click)="showDialogEditar(integ)"></p-button>
              <p-button icon="pi pi-trash" severity="danger" (click)="eliminar(integ)"></p-button>
            </ng-container>

            <ng-template #inactivoActions>
              <p-button label="Reactivar" icon="pi pi-check" severity="success" (click)="reactivar(integ)"></p-button>
            </ng-template>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

</div>
