
<div class="card">
    <h1>Gestión Almacenes</h1>
    <p-select [options]="sucursales()" [(ngModel)]="selectedSucursal" optionLabel="nombre" optionValue="id" placeholder="Seleccionar sucursales" class="w-full md:w-56" (onChange)="funGetAlmacenes()"/>

    <p-table [value]="almacenes()" stripedRows [tableStyle]="{'min-width': '50rem'}">
        <ng-template #header>
            <tr>
                <th>Id</th>
                <th>Codigo</th>
                <th>Nombre</th>
                <th>Descripción</th>
            </tr>
        </ng-template>
        <ng-template #body let-almacen>
            <tr>
                <td>{{almacen.id}}</td>
                <td>{{almacen.codigo}}</td>
                <td>{{almacen.nombre}}</td>
                <td>{{almacen.descripcion}}</td>
            </tr>
        </ng-template>
    </p-table>
    
</div>
{{almacenes() | json}}
