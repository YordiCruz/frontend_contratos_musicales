<!-- FORMULARIO CREAR / EDITAR CATEGORÍA -->
<p-dialog
  [header]="modo === 'create' ? 'Registrar Categoría' : 'Editar Categoría'"
  [modal]="true"
  [(visible)]="visible"
  [breakpoints]="{ '960px': '75vw', '640px': '95vw' }"
  [style]="{ width: '30rem' }"
  [draggable]="false"
  [resizable]="false"
>
  <span class="text-gray-500 block mb-4">
    Complete los datos de la categoría de evento.
  </span>

  <form [formGroup]="formCategoria" class="p-fluid">

    <!-- Nombre -->
    <div class="flex flex-col mb-3">
      <label class="font-semibold">Nombre</label>
      <input
        pInputText
        formControlName="nombre"
        class="w-full"
        [ngClass]="{ 'ng-invalid ng-dirty': formCategoria.controls['nombre'].invalid && formCategoria.controls['nombre'].touched }"
      />
    </div>

    <!-- Descripción -->
    <div class="flex flex-col mb-3">
      <label class="font-semibold">Descripción</label>
      <textarea
        pInputTextarea
        formControlName="descripcion"
        class="w-full"
        rows="3"
      ></textarea>
    </div>

    <!-- Botones -->
    <div class="flex justify-end gap-2 mt-4">
      <p-button
        label="Cancelar"
        severity="secondary"
        (click)="closeDialog()"
      ></p-button>

      <p-button
        label="Guardar"
        [disabled]="formCategoria.invalid"
        (click)="guardar()"
      ></p-button>
    </div>

  </form>
</p-dialog>


<!-- LISTA DE CATEGORÍAS -->
<div class="card">

  <!-- Título + Acciones -->
  <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6 gap-6">
    <h1 class="text-3xl md:text-4xl font-bold">Categorías de Eventos</h1>

    <div class="flex flex-col md:flex-row items-stretch md:items-center gap-2">

      <!-- Buscador -->
      <p-iconfield iconPosition="left" class="w-full md:w-auto">
        <p-inputicon><i class="pi pi-search"></i></p-inputicon>
        <input
          pInputText
          type="text"
          placeholder="Buscar categoría..."
          class="border rounded px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 w-full"
          (input)="dt.filterGlobal($any($event.target).value, 'contains')"
        />
      </p-iconfield>

      <!-- Botón Nueva Categoría -->
      <p-button
        label="Nueva Categoría"
        icon="pi pi-plus"
        (click)="openCreate()"
      ></p-button>
    </div>
  </div>

  <!-- Tabla -->
  <div class="overflow-x-auto w-full">
    <p-table
      [value]="categorias()"
      #dt
      [paginator]="true"
      [rows]="rows"
      [first]="first"
      [rowsPerPageOptions]="[5, 10, 20]"
      [globalFilterFields]="['nombre', 'descripcion', 'estado']"
      [paginatorDropdownAppendTo]="'body'"
      [customSort]="true"
      (sortFunction)="customSort($event)"
      [tableStyle]="{ 'min-width': '50rem' }"
    >

      <!-- ENCABEZADO -->
      <ng-template pTemplate="header">
        <tr>
          <th>#</th>

          <th pSortableColumn="nombre">
            <div class="flex items-center gap-2">
              Nombre
              <p-sortIcon field="nombre"></p-sortIcon>
            </div>
          </th>

          <th>Descripción</th>

          <th pSortableColumn="estado">
            <div class="flex items-center gap-2">
              Estado
              <p-sortIcon field="estado"></p-sortIcon>
            </div>
          </th>

          <th>Acciones</th>
        </tr>
      </ng-template>

      <!-- CUERPO -->
      <ng-template pTemplate="body" let-i="rowIndex" let-cat>
        <tr>
          <td>{{ i + 1 }}</td>

          <td>{{ cat.nombre }}</td>

          <td>{{ cat.descripcion || '-' }}</td>

          <td>
            <p-tag
              [value]="cat.estado"
              [severity]="cat.estado === 'activo' ? 'success' : 'danger'"
            />
          </td>

          <td class="flex gap-2">

            <!-- Si está ACTIVO -->
            <ng-container *ngIf="cat.estado === 'activo'; else inactiva">
              <p-button
                icon="pi pi-pencil"
                class="mr-2"
                (click)="openEdit(cat)"
              ></p-button>

              <p-button
                icon="pi pi-ban"
                severity="danger"
                (click)="changeEstado(cat, 'inactivo')"
              ></p-button>
            </ng-container>

            <!-- Si está INACTIVO -->
            <ng-template #inactiva>
              <p-button
                label="Reactivar"
                icon="pi pi-check"
                severity="success"
                (click)="changeEstado(cat, 'activo')"
              ></p-button>
            </ng-template>

          </td>
        </tr>
      </ng-template>

    </p-table>
  </div>

</div>
