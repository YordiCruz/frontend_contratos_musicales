<div class="card">

  <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6 gap-4">
    <h1 class="text-3xl md:text-4xl font-bold">Lista de Clientes</h1>

    <div class="flex flex-col md:flex-row items-stretch md:items-center gap-2">
      <p-iconfield iconPosition="left" class="w-full md:w-auto">
        <p-inputicon><i class="pi pi-search"></i></p-inputicon>
        <input
          pInputText
          type="text"
          placeholder="Buscar cliente..."
          class="border rounded px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 w-full"
          (input)="dt.filterGlobal($any($event.target).value, 'contains')"
        />
      </p-iconfield>

      <p-button
        label="Nuevo Cliente"
        icon="pi pi-plus"
        (click)="openCreate()"
      ></p-button>
    </div>
  </div>

  <div class="overflow-x-auto w-full">
    <p-table
      [value]="clientes()"
      #dt
      [paginator]="true"
      [rows]="rows"
      [first]="first"
      (onPage)="pageChange($event)"
      [rowsPerPageOptions]="[5, 10, 20]"
      [globalFilterFields]="[
        'persona.nombre',
        'persona.apellido',
        'persona.documento_identidad',
        'persona.telefono',
        'persona.email'
      ]"
      [customSort]="true"
      (sortFunction)="customSort($event)"
      [tableStyle]="{ 'min-width': '65rem' }"
    >

      <ng-template pTemplate="header">
        <tr>
          <th>#</th>
          <th pSortableColumn="persona.nombre">
            <div class="flex items-center gap-2">
              Nombre
              <p-sortIcon field="persona.nombre"></p-sortIcon>
            </div>
          </th>
          <th pSortableColumn="persona.documento_identidad">
            <div class="flex items-center gap-2">
              Documento
              <p-sortIcon field="persona.documento_identidad"></p-sortIcon>
            </div>
          </th>
          <th pSortableColumn="persona.telefono">
            <div class="flex items-center gap-2">
              Teléfono
              <p-sortIcon field="persona.telefono"></p-sortIcon>
            </div>
          </th>
          <th pSortableColumn="preferencia_contacto">
            <div class="flex items-center gap-2">
              Preferencia
              <p-sortIcon field="preferencia_contacto"></p-sortIcon>
            </div>
          </th>
          <th pSortableColumn="estado">
            <div class="flex items-center gap-2">
              Estado
              <p-sortIcon field="estado"></p-sortIcon>
            </div>
          </th>
          <th>Acciones</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-i="rowIndex" let-cli>
        <tr>
          <td>{{ i + 1 }}</td>
          <td>{{ cli.persona.nombre }} {{ cli.persona.apellido }}</td>
          <td>{{ cli.persona.documento_identidad }}</td>
          <td>{{ cli.persona.telefono }}</td>
          <td>{{ cli.preferencia_contacto || '-' }}</td>
          <td>
            <p-tag [value]="cli.estado" [severity]="cli.estado === 'activo' ? 'success' : 'danger'" />
          </td>
          <td>
            <ng-container *ngIf="cli.estado === 'activo'; else inactivoActions">
              <p-button icon="pi pi-pencil" class="mr-2" (click)="openEdit(cli)"></p-button>
              <p-button icon="pi pi-trash" severity="danger" (click)="changeEstado(cli.id, 'inactivo')"></p-button>
            </ng-container>
            <ng-template #inactivoActions>
              <p-button label="Reactivar" icon="pi pi-check" severity="success" (click)="changeEstado(cli.id, 'activo')"></p-button>
            </ng-template>
          </td>
        </tr>
      </ng-template>

    </p-table>
  </div>
</div>

<!-- Diálogo que contiene el formulario separado -->
<p-dialog [(visible)]="visibleForm" [modal]="true" header="Formulario Cliente" [style]="{width: '32rem'}">
  <app-cliente-form
    [cliente]="clienteSeleccionado"
    (clienteRegistrado)="onClienteGuardado($event)"
    (cerrar)="visibleForm=false">
  </app-cliente-form>
</p-dialog>
