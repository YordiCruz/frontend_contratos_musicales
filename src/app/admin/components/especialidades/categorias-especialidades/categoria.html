<div class="card">

  <h1 class="text-3xl font-bold mb-4">Lista de Categorías</h1>

  <p-button label="Crear Nueva Categoría" icon="pi pi-plus" (click)="openCreate()"></p-button>

  <div *ngIf="!loading() && categorias().length > 0; else cargando" class="mt-4">

    <div class="overflow-x-auto">
      <p-table
        [value]="categorias()"
        dataKey="id_categoria"
        [rowHover]="true"
        [rows]="10"
        [paginator]="true"
        [rowsPerPageOptions]="[5, 10, 20]"
        currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} categorías"
      >
        <ng-template pTemplate="header">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Acciones</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-cat>
          <tr>
            <td>{{ cat.id_categoria }}</td>
            <td>{{ cat.nombre }}</td>
            <td>{{ cat.descripcion }}</td>
            <td class="flex gap-2">
              <p-button icon="pi pi-pencil" (click)="openEdit(cat)"></p-button>
              <p-button icon="pi pi-trash" severity="danger" (click)="deleteCategoria(cat.id_categoria)"></p-button>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="4">No se encontraron categorías.</td>
          </tr>
        </ng-template>
      </p-table>
    </div>

  </div>

  <ng-template #cargando>
    <p-progressbar mode="indeterminate" style="height: 6px"></p-progressbar>
  </ng-template>

</div>


<!-- MODAL UNIFICADO -->
<p-dialog
  header="{{ isEdit ? 'Editar Categoría' : 'Nueva Categoría' }}"
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '25rem' }"
>
  <form [formGroup]="categoriaForm" (ngSubmit)="guardarCategoria()">

    <div class="p-fluid">

      <div class="flex items-center gap-4 mb-3">
        <label class="font-semibold w-28">Nombre</label>
        <input pInputText class="flex-auto" formControlName="nombre" />
      </div>

      <div class="flex items-center gap-4 mb-3">
        <label class="font-semibold w-28">Descripción</label>
        <input pInputText class="flex-auto" formControlName="descripcion" />
      </div>

    </div>

    <div class="flex justify-end gap-2 mt-4">
      <p-button label="Cancelar" severity="secondary" (click)="closeDialog()"></p-button>
      <p-button label="Guardar" type="submit" [disabled]="categoriaForm.invalid"></p-button>
    </div>

  </form>
</p-dialog>
