


<form [formGroup]="formEvento" class="p-fluid">
  <div class="flex flex-col mb-3">
    <label class="font-semibold">Nombre</label>
    <input pInputText formControlName="nombre" class="w-full" />
    <small *ngIf="formEvento.get('nombre')?.invalid && formEvento.get('nombre')?.touched" class="text-red-500">
      El nombre es obligatorio y debe tener al menos 3 caracteres.
    </small>
  </div>

  <div class="flex flex-col mb-3">
    <label class="font-semibold">Descripción</label>
    <textarea pInputTextarea formControlName="descripcion" class="w-full" rows="3"></textarea>
  </div>

  <div class="flex flex-col mb-3">
    <label class="font-semibold">Precio base</label>
    <input pInputText type="number" formControlName="precio_base" class="w-full" min="0" step="0.01" />
    <small *ngIf="formEvento.get('precio_base')?.invalid && formEvento.get('precio_base')?.touched" class="text-red-500">
      El precio debe ser un número mayor o igual a 0.
    </small>
  </div>

  <div class="flex flex-col mb-3">
    <label class="font-semibold">Categoría</label>
    <p-select
      [options]="categorias"
      optionLabel="nombre"
      optionValue="id_categoria"
      formControlName="id_categoria"
      placeholder="Seleccione una categoría"
      class="w-full"
      appendTo="body"
    ></p-select>
    <small *ngIf="formEvento.get('id_categoria')?.invalid && formEvento.get('id_categoria')?.touched" class="text-red-500">
      Seleccione una categoría.
    </small>
  </div>

  <div class="flex justify-end gap-2 mt-4">
    <p-button label="Cancelar" severity="secondary" (click)="onCerrar()"></p-button>
    <p-button [label]="modo === 'create' ? 'Guardar evento' : 'Guardar cambios'" [disabled]="formEvento.invalid" (click)="onGuardar()"></p-button>
  </div>
</form>
