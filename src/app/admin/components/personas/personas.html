<div class="card">

  <!-- HEADER -->
  <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6 gap-4">
    <h1 class="text-3xl md:text-4xl font-bold">Lista de Personas</h1>

    <div class="flex flex-col md:flex-row items-stretch md:items-center gap-2">

      <!-- BUSCADOR GLOBAL -->
      <p-iconfield iconPosition="left" class="w-full md:w-auto">
        <p-inputicon><i class="pi pi-search"></i></p-inputicon>
        <input
          pInputText
          type="text"
          placeholder="Buscar persona..."
          class="border rounded px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 w-full md:w-auto"
          (input)="dt.filterGlobal($any($event.target).value, 'contains')"
        />
      </p-iconfield>

    </div>
  </div>

  <!-- TABLA -->
 <div class="overflow-x-auto w-full">
  <p-table
    [value]="personas()"
    #dt
    [paginator]="true"
    [rows]="rows"
    [first]="first"
    (onPage)="pageChange($event)"
    [customSort]="true"
    (sortFunction)="customSort($event)"
    [paginatorDropdownAppendTo]="'body'"
    [rowsPerPageOptions]="[5, 10, 20]"
    [globalFilterFields]="[
      'nombre',
      'apellido',
      'documento_identidad',
      'telefono',
      'email',
      'estado'
    ]"
    responsiveLayout="scroll"
    [tableStyle]="{
      'min-width': '65rem',
      'white-space': 'nowrap'
    }"
  >

    <ng-template pTemplate="header">
      <tr class="text-sm">

        <th pSortableColumn="nombre" class="px-3 py-2 whitespace-nowrap">
          <div class="flex items-center gap-1">
            Nombre
            <p-sortIcon field="nombre"></p-sortIcon>
          </div>
        </th>

        <th pSortableColumn="apellido" class="px-3 py-2 whitespace-nowrap">
          <div class="flex items-center gap-1">
            Apellido
            <p-sortIcon field="apellido"></p-sortIcon>
          </div>
        </th>

        <th pSortableColumn="documento_identidad" class="px-3 py-2 whitespace-nowrap">
          <div class="flex items-center gap-1">
            Documento
            <p-sortIcon field="documento_identidad"></p-sortIcon>
          </div>
        </th>

        <th pSortableColumn="telefono" class="px-3 py-2 whitespace-nowrap">
          <div class="flex items-center gap-1">
            Teléfono
            <p-sortIcon field="telefono"></p-sortIcon>
          </div>
        </th>

        <th pSortableColumn="email" class="px-3 py-2 whitespace-nowrap">
          <div class="flex items-center gap-1">
            Correo
            <p-sortIcon field="email"></p-sortIcon>
          </div>
        </th>

        <th pSortableColumn="estado" class="px-3 py-2 whitespace-nowrap">
          <div class="flex items-center gap-1">
            Estado
            <p-sortIcon field="estado"></p-sortIcon>
          </div>
        </th>

        <th class="px-3 py-2 whitespace-nowrap">Acciones</th>

      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-p>
      <tr class="text-sm">

        <td class="px-3 py-2">{{ p.nombre }}</td>
        <td class="px-3 py-2">{{ p.apellido }}</td>
        <td class="px-3 py-2">{{ p.documento_identidad }}</td>
        <td class="px-3 py-2">{{ p.telefono }}</td>
        <td class="px-3 py-2">{{ p.email }}</td>

        <td class="px-3 py-2">
          <p-tag
            [value]="p.estado"
            [severity]="p.estado === 'activo' ? 'success' : 'danger'"
          ></p-tag>
        </td>

        <td class="px-3 py-2">
          <div class="flex gap-2">
            <ng-container *ngIf="p.estado === 'activo'; else inactivoActions">

              <p-button
                icon="pi pi-pencil"
                size="small"
                (click)="openEdit(p)"
              ></p-button>

              <p-button
                icon="pi pi-trash"
                severity="danger"
                size="small"
                (click)="changeEstado(p.id, 'inactivo')"
              ></p-button>

            </ng-container>

            <ng-template #inactivoActions>
              <p-button
                label="Reactivar"
                icon="pi pi-check"
                severity="success"
                size="small"
                (click)="changeEstado(p.id, 'activo')"
              ></p-button>
            </ng-template>
          </div>
        </td>

      </tr>
    </ng-template>

  </p-table>
</div>

</div>

<!-- MODAL EDITAR -->
<p-dialog
  header="Editar Persona"
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '30rem' }"
  appendTo="body"
>
  <form [formGroup]="formEditar" (ngSubmit)="guardarEditar()">

    <div class="p-fluid">

      <!-- NOMBRE -->
      <div class="flex flex-col mb-3">
        <label class="font-semibold">Nombre</label>
        <input
          pInputText
          formControlName="nombre"
          [ngClass]="{ 'ng-invalid ng-dirty': formEditar.controls['nombre'].invalid && formEditar.controls['nombre'].touched }"
        />
        <small class="text-red-500" *ngIf="formEditar.controls['nombre'].invalid && formEditar.controls['nombre'].touched">
          El nombre es obligatorio.
        </small>
      </div>

      <!-- APELLIDO -->
      <div class="flex flex-col mb-3">
        <label class="font-semibold">Apellido</label>
        <input
          pInputText
          formControlName="apellido"
          [ngClass]="{ 'ng-invalid ng-dirty': formEditar.controls['apellido'].invalid && formEditar.controls['apellido'].touched }"
        />
        <small class="text-red-500" *ngIf="formEditar.controls['apellido'].invalid && formEditar.controls['apellido'].touched">
          El apellido es obligatorio.
        </small>
      </div>

      <!-- DOCUMENTO -->
      <div class="flex flex-col mb-3">
        <label class="font-semibold">Documento</label>
        <input
          pInputText
          formControlName="documento_identidad"
          [ngClass]="{ 'ng-invalid ng-dirty': formEditar.controls['documento_identidad'].invalid && formEditar.controls['documento_identidad'].touched }"
        />
        <small class="text-red-500" *ngIf="formEditar.controls['documento_identidad'].invalid && formEditar.controls['documento_identidad'].touched">
          Documento inválido.
        </small>
      </div>

      <!-- TELEFONO -->
      <div class="flex flex-col mb-3">
        <label class="font-semibold">Teléfono</label>
        <input
          pInputText
          formControlName="telefono"
          [ngClass]="{ 'ng-invalid ng-dirty': formEditar.controls['telefono'].invalid && formEditar.controls['telefono'].touched }"
        />
        <small class="text-red-500" *ngIf="formEditar.controls['telefono'].invalid && formEditar.controls['telefono'].touched">
          Teléfono inválido.
        </small>
      </div>

      <!-- EMAIL -->
      <div class="flex flex-col mb-3">
        <label class="font-semibold">Correo</label>
        <input
          pInputText
          formControlName="email"
          [ngClass]="{ 'ng-invalid ng-dirty': formEditar.controls['email'].invalid && formEditar.controls['email'].touched }"
        />
        <small class="text-red-500" *ngIf="formEditar.controls['email'].invalid && formEditar.controls['email'].touched">
          Correo inválido.
        </small>
      </div>

    </div>

    <div class="flex justify-end gap-2 mt-4">
      <p-button label="Cancelar" severity="secondary" (click)="closeDialog()"></p-button>
      <p-button label="Guardar" type="submit" [disabled]="formEditar.invalid"></p-button>
    </div>

  </form>
</p-dialog>
