<div class="card">

 <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6 gap-4">

  <h1 class="text-3xl md:text-4xl font-bold">Lista de Especialidades</h1>

  <div class="flex flex-col md:flex-row items-stretch md:items-center gap-2">

    <!-- BUSCADOR GLOBAL -->
    <p-iconfield iconPosition="left" class="w-full md:w-auto">
      <p-inputicon><i class="pi pi-search"></i></p-inputicon>
      <input
        pInputText
        type="text"
        placeholder="Buscar especialidad..."
        class="border rounded px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 w-full md:w-auto"
        (input)="dt.filterGlobal($any($event.target).value, 'contains')"
      />
    </p-iconfield>

    <!-- BOTÓN NUEVA ESPECIALIDAD -->
    <p-button
      label="Nueva Especialidad"
      icon="pi pi-plus"
      (click)="openCreate()"
    ></p-button>

  </div>

</div>


  <div class="mt-4 overflow-x-auto">
    <p-table
  [value]="especialidades()"
  #dt
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[5, 10, 20]"
  [globalFilterFields]="['nombre','descripcion','categoria.nombre','estado']"
  responsiveLayout="scroll"
>

  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="nombre">Nombre <p-sortIcon field="nombre"></p-sortIcon></th>
      <th pSortableColumn="descripcion">Descripción <p-sortIcon field="descripcion"></p-sortIcon></th>
      <th pSortableColumn="categoria.nombre">Categoría <p-sortIcon field="categoria.nombre"></p-sortIcon></th>
      <th pSortableColumn="estado">Estado <p-sortIcon field="estado"></p-sortIcon></th>
      <th>Acciones</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-esp>
    <tr>

      <td>{{ esp.nombre }}</td>
      <td>{{ esp.descripcion || '—' }}</td>
      <td>{{ esp.categoria?.nombre || '—' }}</td>

      <!-- ESTADO CON COLORES -->
      <td>
        <p-tag 
          [value]="esp.estado"
          [severity]="esp.estado === 'activo' ? 'success' : 'danger'"
        ></p-tag>
      </td>

      <td class="flex gap-2">

        <!-- SI ESTÁ ACTIVO: EDITAR + INACTIVAR -->
        <ng-container *ngIf="esp.estado === 'activo'; else inactivoActions">

          <p-button 
            icon="pi pi-pencil"
            (click)="openEdit(esp)"
          ></p-button>

          <p-button 
            icon="pi pi-trash"
            severity="danger"
            (click)="changeEstado(esp.id , 'inactivo')"
          ></p-button>

        </ng-container>

        <!-- SI ESTÁ INACTIVO: SOLO REACTIVAR -->
        <ng-template #inactivoActions>
          <p-button 
            label="Reactivar"
            icon="pi pi-check"
            severity="success"
            (click)="changeEstado(esp.id, 'activo')"
          ></p-button>
        </ng-template>

      </td>

    </tr>
  </ng-template>

</p-table>
  </div>

</div>

<!-- MODAL -->
<p-dialog
  header="{{ isEdit ? 'Editar Especialidad' : 'Nueva Especialidad' }}"
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '30rem' }"
>
  <form [formGroup]="especialidadForm" (ngSubmit)="guardarEspecialidad()">

    <div class="p-fluid">

      <div class="flex items-center gap-4 mb-3">
        <label class="font-semibold w-28">Nombre</label>
        <input pInputText formControlName="nombre" class="flex-auto" />
      </div>

      <div class="flex items-center gap-4 mb-3">
        <label class="font-semibold w-28">Descripción</label>
        <input pInputText formControlName="descripcion" class="flex-auto" />
      </div>

      <div class="flex items-center gap-4 mb-3">
        <label class="font-semibold w-28">Categoría</label>
        <p-select
          [options]="categorias()"
          optionLabel="nombre"
          optionValue="id"
          formControlName="id_categoria"
          placeholder="Seleccionar categoría"
          class="flex-auto"
          appendTo="body"
        ></p-select>
      </div>

    </div>

    <div class="flex justify-end gap-2 mt-4">
      <p-button label="Cancelar" severity="secondary" (click)="closeDialog()"></p-button>
      <p-button label="Guardar" type="submit" [disabled]="especialidadForm.invalid"></p-button>
    </div>

  </form>
</p-dialog>
