<!-- Chatbot Wrapper -->
<div class="fixed bottom-6 right-6 z-50 flex flex-col items-end space-y-2">
  <!-- Mensaje flotante -->
  <div *ngIf="!chatVisible" class="bg-white text-gray-800 px-3 py-1 rounded-lg shadow text-sm animate-fade-in">
    ¿Necesitas ayuda?
  </div>

  <!-- Botón flotante -->
  <button
    (click)="toggleChat()"
    class="w-14 h-14 rounded-full bg-blue-600 text-white shadow-lg flex items-center justify-center hover:bg-blue-700 transition"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
         viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.77 9.77 0 01-4-.83L3 21l1.36-3.64A7.94 7.94 0 013 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
    </svg>
  </button>

  <!-- Caja del Chat -->
  <div *ngIf="chatVisible" class="w-80 max-w-full h-[80vh] bg-white border border-gray-300 rounded-lg shadow-xl overflow-hidden">
    <!-- Tu chat aquí -->
    <div class="flex flex-col h-full">
      <!-- Chat messages -->
     <!-- Lista de mensajes -->
<div class="flex-1 overflow-y-auto p-4 bg-gray-50 space-y-2">
  <div *ngFor="let msg of messages" class="flex">
    <div
      [ngClass]="{
        'ml-auto bg-blue-500 text-white': msg.role === 'user',
        'mr-auto bg-gray-200 text-gray-800': msg.role === 'assistant'
      }"
      class="px-4 py-2 rounded-lg max-w-[80%] w-fit"
    >
      <strong class="capitalize">{{ msg.role }}:</strong> {{ msg.content }}
    </div>
  </div>

  <!-- Indicador de carga dentro del flujo -->
  <div *ngIf="isLoading" class="mr-auto bg-gray-200 text-gray-800 px-4 py-2 rounded-lg max-w-[80%] w-fit italic animate-pulse">
    <strong>assistant:</strong> escribiendo...
  </div>
</div>



      <!-- Chat form -->
      <form (submit)="sendMessage($event)" class="flex items-center gap-2 p-4 border-t">
        <input
          type="text"
          [(ngModel)]="userInput"
          name="message"
          placeholder="Escribe tu mensaje..."
          required
          class="flex-1 px-3 py-2 border rounded-md focus:outline-none focus:ring focus:ring-blue-400"
        />
        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition">
          Enviar
        </button>
      </form>
    </div>
  </div>
</div>
